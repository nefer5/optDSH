title: PPT 制作流程试跑
slides:
  - title: 先确认内容，再整理视觉
    body:
      - 本次只验证制作、修改与导出的闭环。
      - 所有内容均为合成演示，不使用公司资料。
    font: 微软雅黑
  - title: 逐页结论应当形成完整逻辑
    body:
      - 每页说明一个重点，并写出支持它的依据。
      - 用户直接修改后，Agent继续读取最新稿件。
    font: 等线
  - title: 三个阶段使用同一份稿件
    steps: [背景与内容讨论, 页面编辑与反馈, 整理与PPTX导出]
    font: 楷体
  - title: 首轮以流程跑通为验收目标
    rows:
      - [环节, 验收内容]
      - [创建, 四页内容正确]
      - [修改, 读取最新版本]
      - [导出, 文字与表格保留]
    font: 仿宋
