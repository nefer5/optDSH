# Explicit project policy for the pinned DSH runtime; no model credentials.
- id: session-log-deepseek
  config:
    enabled: false
# Use the official in-browser workspace picker for an embedded/remote browser.
- id: directory-picker
  disabled: true
- insert:
    - id: optdsh-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: optdsh-directory-picker-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: optdsh-agent-canvas
      name: ../plugins/optdsh-agent-canvas/lib/index.js
    - id: optdsh-optics-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: optics
        transport: stdio
        command: !!js process.cwd() + "/.venv/Scripts/python.exe"
        args: ['-X', 'utf8', 'packages/optics/scripts/mcp.py']
        cwd: !!js process.cwd()
        toolCallTimeoutMs: 45000
        failOnStartupError: false

- insert:
    - id: optdsh-workbench
      name: ../plugins/optdsh-workbench/lib/index.js
    - id: optdsh-forms
      name: ../plugins/optdsh-forms/lib/index.js

# Native project expert preset; Standard remains the default.
- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js process.cwd() + '/.agents/dsh-presets'
        trust: user
- insert:
    - id: optdsh-expert-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: optdsh-visual-designer
    - id: optdsh-experts
      name: ../plugins/optdsh-experts/lib/index.js
