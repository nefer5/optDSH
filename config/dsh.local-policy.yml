# Explicit project policy for the pinned DSH runtime; no model credentials.
- id: session-log-deepseek
  config:
    enabled: false
# Use the official in-browser workspace picker for an embedded/remote browser.
- id: directory-picker
  disabled: true
- insert:
    - id: optdsh-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: optdsh-directory-picker-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: optdsh-agent-canvas
      name: ../plugins/optdsh-agent-canvas/lib/index.js
    - id: optdsh-optics-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: optics
        transport: stdio
        command: !!js process.cwd() + "/.venv/Scripts/python.exe"
        args: ['-X', 'utf8', 'packages/optics/scripts/mcp.py']
        cwd: !!js process.cwd()
        toolCallTimeoutMs: 45000
        failOnStartupError: false

- insert:
    - id: optdsh-workbench
      name: ../plugins/optdsh-workbench/lib/index.js
    - id: optdsh-forms
      name: ../plugins/optdsh-forms/lib/index.js

# Native project expert presets; Standard remains the default. One spawn provider
# serves every expert because persona is supplied per delegation request.
- id: agent-preset-registry
  config:
    default: standard
- insert:
    - id: optdsh-expert-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: optdsh-experts
    - id: optdsh-experts
      name: ../plugins/optdsh-experts/lib/index.js
    # SessionStart architecture context only; no Stop scanning or continuation.
    # Git pre-commit performs the advisory staged scan. The hook config is
    # process-wide and read once at load; a missing file only logs a warning. No
    # projectDir: each hook runs in, and receives CLAUDE_PROJECT_DIR for, the session cwd.
    - id: optdsh-hooks-software-architect
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js process.cwd() + "/.agents/dsh-hooks/software-architect.json"
        defaultTimeoutMs: 10000
